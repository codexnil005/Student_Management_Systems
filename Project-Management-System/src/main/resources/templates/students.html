<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f4f6f9; }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        .table-hover tbody tr:hover { background-color: #e9ecef; }
        .card { border-radius: 10px; border: none; }
    </style>
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/students">
            <i class="fa-solid fa-graduation-cap me-2"></i>Student Management System
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-secondary fw-bold"><i class="fa-solid fa-users me-2"></i>Student List</h3>
        <a th:href="@{/students/new}" class="btn btn-primary shadow-sm">
            <i class="fa-solid fa-user-plus me-1"></i> Add New Student
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th><i class="fa-solid fa-user me-1"></i> Name</th>
                    <th><i class="fa-solid fa-envelope me-1"></i> Email</th>
                    <th><i class="fa-solid fa-book me-1"></i> Course</th>
                    <th class="text-center"><i class="fa-solid fa-gear me-1"></i> Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <td class="align-middle" th:text="${student.name}"></td>
                    <td class="align-middle" th:text="${student.email}"></td>
                    <td class="align-middle" th:text="${student.course}"></td>
                    <td class="text-center">
                        <a th:href="@{/students/delete/{id}(id=${student.id})}"
                           class="btn btn-danger btn-sm shadow-sm"
                           onclick="return confirm('Are you sure you want to delete this student?');">
                            <i class="fa-solid fa-trash me-1"></i> Delete
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="4" class="text-center text-muted py-4">No students found. Please add a new student.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
