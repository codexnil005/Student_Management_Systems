<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add New Student</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { background-color: #f4f6f9; }
    .navbar-brand { font-weight: bold; letter-spacing: 1px; }
    .card { border-radius: 12px; }
  </style>
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/students">
      <i class="fa-solid fa-graduation-cap me-2"></i>Student Management System
    </a>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-7">

      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0"><i class="fa-solid fa-user-plus me-2"></i>Add New Student</h4>
        </div>
        <div class="card-body p-4">

          <form th:action="@{/students}" th:object="${student}" method="POST">

            <div class="mb-4">
              <label class="form-label text-muted fw-bold">Student Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-user text-secondary"></i></span>
                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Rahul Das" required />
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted fw-bold">Student Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-secondary"></i></span>
                <input type="email" th:field="*{email}" class="form-control" placeholder="e.g. rahul@gmail.com" required />
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted fw-bold">Course</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-book text-secondary"></i></span>
                <input type="text" th:field="*{course}" class="form-control" placeholder="e.g. B.Tech in CSE" required />
              </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
              <button type="submit" class="btn btn-success px-4 shadow-sm">
                <i class="fa-solid fa-check me-1"></i> Save Student
              </button>
              <a th:href="@{/students}" class="btn btn-outline-secondary px-4 shadow-sm">
                <i class="fa-solid fa-xmark me-1"></i> Cancel
              </a>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
